{% extends "base.html" %}

{% block title %}Job Not Found — HireVolt{% endblock %}

{% block body %}
<div class="app-container" style="min-height: calc(100vh - var(--navbar-height) - 160px); display:flex; align-items:center; justify-content:center; padding:var(--space-12) var(--space-4);">
    <div class="card" style="max-width:540px; width:100%; text-align:center; padding:var(--space-10) var(--space-8); background:#0F172A; border:1px solid rgba(255,255,255,0.1); border-radius:16px; box-shadow:0 20px 40px -15px rgba(0,0,0,0.7);">
        <div style="width:72px; height:72px; border-radius:50%; background:rgba(239,68,68,0.12); color:#F87171; display:flex; align-items:center; justify-content:center; font-size:2rem; margin:0 auto var(--space-5); border:1px solid rgba(239,68,68,0.25);">
            <i class="fas fa-search-minus"></i>
        </div>
        
        <h1 style="font-size:1.75rem; font-weight:800; color:#F8FAFC; margin-bottom:var(--space-3);">Job Not Found</h1>
        
        <p style="font-size:1rem; color:#94A3B8; line-height:1.6; margin-bottom:var(--space-6);">
            This job may have been removed or is no longer available.
        </p>

        <div style="display:flex; flex-direction:column; sm:flex-row; gap:12px; justify-content:center;">
            <a href="/jobs" class="btn btn-primary btn-lg" style="box-shadow:0 0 20px rgba(255,94,20,0.35);">
                <i class="fas fa-briefcase"></i> Browse All Active Jobs
            </a>
            <a href="/" class="btn btn-secondary btn-lg">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
