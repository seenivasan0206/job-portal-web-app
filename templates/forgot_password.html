{% extends "base.html" %}

{% block title %}Forgot Password — HireVolt{% endblock %}

{% block body %}
<div class="app-container" style="min-height:calc(100vh - 160px); display:flex; align-items:center; justify-content:center; padding-top:var(--space-8); padding-bottom:var(--space-12);">
    <div class="card" style="width:100%; max-width:480px; padding:var(--space-8); box-shadow:var(--shadow-xl); border:1px solid var(--color-border); background:var(--color-surface);">
        <div style="text-align:center; margin-bottom:var(--space-6);">
            <div style="width:52px; height:52px; border-radius:var(--radius-full); background:var(--color-primary-light); color:var(--color-primary); display:flex; align-items:center; justify-content:center; font-size:22px; margin:0 auto var(--space-3);">
                <i class="fas fa-lock-open"></i>
            </div>
            <h1 style="font-size:var(--font-size-2xl); font-weight:800; margin-bottom:var(--space-1); color:var(--color-text);">Forgot Password</h1>
            <p style="font-size:var(--font-size-sm); color:var(--color-text-secondary); margin:0;" id="fp-subtitle">
                Enter your registered email address to receive a secure recovery code.
            </p>
        </div>

        <!-- Step 1: Request OTP -->
        <div id="step-1-container">
            <form id="step-1-form" onsubmit="event.preventDefault(); handleSendResetOTP();">
                <div class="form-group">
                    <label class="form-label form-label-required">Registered Email Address</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="fp-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>

                <button type="submit" id="btn-send-otp" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--space-4);">
                    <i class="fas fa-paper-plane"></i> Send Reset Code
                </button>
            </form>
        </div>

        <!-- Step 2: Enter OTP & New Password -->
        <div id="step-2-container" style="display:none;">
            <div style="background:var(--color-surface-alt); padding:var(--space-3) var(--space-4); border-radius:var(--radius-md); margin-bottom:var(--space-5); display:flex; align-items:center; justify-content:space-between; font-size:var(--font-size-xs);">
                <span style="color:var(--color-text-secondary);"><i class="fas fa-envelope-open-text" style="color:var(--color-primary); margin-right:6px;"></i> Code sent to: <strong id="sent-email-display" style="color:var(--color-text);"></strong></span>
                <button type="button" class="btn btn-ghost btn-xs" onclick="resetToStepOne()" style="font-size:11px; padding:2px 6px;">Change</button>
            </div>

            <form id="step-2-form" onsubmit="event.preventDefault(); handlePasswordResetSubmit();">
                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label class="form-label form-label-required">Verification Code (OTP)</label>
                        <span id="otp-timer" style="font-size:var(--font-size-xs); color:var(--color-text-muted);">Expires in: <strong id="timer-count">120s</strong></span>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="fp-otp" class="form-control" placeholder="6-digit code" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code">
                        <button type="button" id="btn-resend-otp" class="btn btn-secondary" onclick="handleSendResetOTP(true)" style="white-space:nowrap;">
                            Resend Code
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label form-label-required">New Password</label>
                    <div class="input-icon-wrapper password-input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="fp-pass" class="form-control" placeholder="Min 8 chars with letter & digit" minlength="8" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('fp-pass', this)" aria-label="Toggle password visibility" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label form-label-required">Confirm New Password</label>
                    <div class="input-icon-wrapper password-input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="fp-confirm" class="form-control" placeholder="Re-enter new password" minlength="8" required autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('fp-confirm', this)" aria-label="Toggle password visibility" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-save-password" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--space-4);">
                    <i class="fas fa-check-circle"></i> Save New Password
                </button>
            </form>
        </div>

        <div style="text-align:center; margin-top:var(--space-6); font-size:var(--font-size-sm); border-top:1px solid var(--color-border-subtle); padding-top:var(--space-4);">
            <a href="/signup?tab=login" style="color:var(--color-primary); font-weight:600; display:inline-flex; align-items:center; gap:6px;">
                <i class="fas fa-arrow-left"></i> Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let countdownInterval = null;
    let secondsRemaining = 120;

    function startOtpCountdown() {
        if (countdownInterval) clearInterval(countdownInterval);
        secondsRemaining = 120;
        const countEl = document.getElementById('timer-count');
        const resendBtn = document.getElementById('btn-resend-otp');
        if (resendBtn) resendBtn.disabled = true;

        countdownInterval = setInterval(() => {
            secondsRemaining--;
            if (countEl) countEl.textContent = `${secondsRemaining}s`;
            if (secondsRemaining <= 0) {
                clearInterval(countdownInterval);
                if (countEl) countEl.textContent = 'Expired';
                if (resendBtn) resendBtn.disabled = false;
            }
        }, 1000);
    }

    function resetToStepOne() {
        if (countdownInterval) clearInterval(countdownInterval);
        document.getElementById('step-2-container').style.display = 'none';
        document.getElementById('step-1-container').style.display = 'block';
        document.getElementById('fp-subtitle').textContent = 'Enter your registered email address to receive a secure recovery code.';
    }

    async function handleSendResetOTP(isResend = false) {
        const email = document.getElementById('fp-email').value.trim();
        if (!email) {
            showToast('Please enter your email address.', 'error');
            return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showToast('Please enter a valid email address format.', 'error');
            return;
        }

        const btn = isResend ? document.getElementById('btn-resend-otp') : document.getElementById('btn-send-otp');
        const origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

        try {
            const res = await postReq('/api/send_otp', { email: email, action: 'forgot' });
            btn.disabled = false;
            btn.innerHTML = origText;

            if (res.success) {
                showToast(res.message || 'Verification code sent to your email.', 'success');
                document.getElementById('sent-email-display').textContent = email;
                document.getElementById('step-1-container').style.display = 'none';
                document.getElementById('step-2-container').style.display = 'block';
                document.getElementById('fp-subtitle').textContent = 'Enter the 6-digit verification code and your new password.';
                startOtpCountdown();
                document.getElementById('fp-otp').focus();
            } else {
                showToast(res.message || 'Unable to send recovery code. Please check your email.', 'error');
            }
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = origText;
            showToast('Network error while requesting verification code.', 'error');
        }
    }

    async function handlePasswordResetSubmit() {
        const email = document.getElementById('fp-email').value.trim();
        const otp = document.getElementById('fp-otp').value.trim();
        const password = document.getElementById('fp-pass').value;
        const confirm = document.getElementById('fp-confirm').value;

        if (!otp || otp.length !== 6) {
            showToast('Please enter the 6-digit verification code.', 'error');
            return;
        }
        if (!password || password.length < 8) {
            showToast('Password must be at least 8 characters long.', 'error');
            return;
        }
        if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
            showToast('Password must contain at least one letter and one number.', 'error');
            return;
        }
        if (password !== confirm) {
            showToast('New passwords do not match. Please re-enter.', 'error');
            return;
        }

        const btn = document.getElementById('btn-save-password');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving Password...';

        try {
            const res = await postReq('/api/reset_password', { email, otp, password });
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Save New Password';

            if (res.success) {
                showToast(res.message || 'Password reset successfully! Redirecting to Sign In...', 'success');
                setTimeout(() => {
                    window.location.href = '/signup?tab=login';
                }, 1200);
            } else {
                showToast(res.message || 'Password reset failed. Please verify your OTP code.', 'error');
            }
        } catch (err) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Save New Password';
            showToast('Network error while resetting password.', 'error');
        }
    }
</script>
{% endblock %}
