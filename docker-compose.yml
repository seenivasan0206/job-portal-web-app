version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_USER=jobportal
      - DB_NAME=jobportal_db
      - DB_PASSWORD=${DB_PASSWORD:-mysql}
      - FLASK_ENV=production
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - ./static/uploads:/app/static/uploads
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mysql}
      MYSQL_DATABASE: ${DB_NAME:-jobportal_db}
      MYSQL_USER: ${DB_USER:-jobportal}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mysql}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  worker:
    build: .
    command: python -m app cron_send_job_alerts
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_USER=jobportal
      - DB_NAME=jobportal_db
      - DB_PASSWORD=${DB_PASSWORD:-mysql}
      - CRON_SECRET=${CRON_SECRET:-secret}
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
