<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Employer Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: "Saira Condensed", sans-serif;
            background: linear-gradient(150deg, #0b1b34, #0f9b8e);
            min-height: 100vh;
        }
        
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.15;
        }
        
        .page-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(150deg, rgba(11, 27, 52, 0.9), rgba(15, 155, 142, 0.9));
            z-index: -1;
        }
        
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #0d1520;
            color: white;
            display: flex;
            flex-direction: column;
            padding-top: 30px;
            z-index: 100;
            transition: 0.3s;
        }
        /* LOGO ALIGNMENT FIX */
        
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 30px 40px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-header img {
            height: 45px;
        }
        
        .sidebar-header h3 {
            margin: 0;
            font-size: 20px;
            color: white;
        }
        
        .sidebar a,
        .sidebar button {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            color: #8a93a3;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            border-left: 4px solid transparent;
        }
        
        .sidebar a:hover,
        .sidebar button:hover {
            background: rgba(15, 155, 142, 0.12);
            color: #fff;
            border-left: 4px solid #0f9b8e;
        }
        
        .sidebar i {
            margin-right: 15px;
        }
        
        .sidebar .logout-btn {
            margin-top: auto;
            margin-bottom: 20px;
            color: #ff6b6b;
            border-left: none;
        }
        
        .main-content {
            margin-left: 260px;
            padding: 40px;
            min-height: 100vh;
        }
        
        .header {
            margin-bottom: 30px;
            color: #fff;
        }
        
        .header h1 {
            font-size: 32px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .card {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            margin-bottom: 30px;
        }
        
        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 2px solid #dee3e6;
            transition: all 0.3s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0f9b8e;
            box-shadow: 0 0 0 4px rgba(15, 155, 142, 0.18);
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            background: #0f9b8e;
        }
        
        .btn:hover {
            background: #0c7d72;
        }
        
        .job-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        
        .job-card {
            border-radius: 12px;
            padding: 20px;
            color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            transition: 0.3s;
        }
        
        .job-card:hover {
            transform: scale(1.03);
        }
        
        .grad-1 {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
        }
        
        .grad-2 {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }
        
        .grad-3 {
            background: linear-gradient(135deg, #0f9b8e, #0c7d72);
        }
        
        .job-card .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            border-radius: 4px;
        }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 600px;
            max-width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: left;
            color: #333;
            position: relative;
        }
        
        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        
        .btn-yes {
            background: #dc3545;
            color: white;
        }
        
        .btn-no {
            background: #6c757d;
            color: white;
        }
        /* Applicant Styles */
        
        .applicant-card {
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fafafa;
            transition: 0.2s;
        }
        
        .applicant-card:hover {
            border-color: #0f9b8e;
        }
        
        .applicant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .applicant-header h3 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-applied {
            background: rgba(15, 155, 142, 0.12);
            color: #0f9b8e;
        }
        
        .status-selected {
            background: #e8f5e9;
            color: #28a745;
        }
        
        .quick-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #555;
        }
        
        .quick-info p {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* Email & Phone Links */
        
        .contact-link {
            color: #0f9b8e;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        
        .contact-link:hover {
            text-decoration: underline;
        }
        
        .copy-hint {
            font-size: 10px;
            color: #aaa;
            margin-left: 5px;
        }
        
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        
        .view-details-btn {
            background: none;
            border: none;
            color: #0f9b8e;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        
        .view-details-btn:hover {
            text-decoration: underline;
        }
        
        .full-details-section {
            display: none;
            margin-top: 15px;
            border-top: 1px dashed #ccc;
            padding-top: 15px;
        }
        
        .full-details-section.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }
        
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .detail-group {
            margin-bottom: 10px;
        }
        
        .detail-group label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }
        
        .detail-group span {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        #notification-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .notification {
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: slideDown 0.5s forwards;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: white;
        }
        
        .notif-success {
            background: #28a745;
        }
        
        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <video autoplay muted loop playsinline><source src="{{ url_for('static', filename='background1.mp4') }}" type="video/mp4"></video>
    <div class="page-overlay"></div>
    <div id="notification-container"></div>

    <div class="sidebar">
        <!-- LOGO ALIGNED HERE -->
        <div class="sidebar-header">
            <img src="{{ url_for('static', filename='dream-logo2.png') }}" alt="Logo">
            <h3>Dashboard</h3>
        </div>

        <a href="#" onclick="showSection('post')"><i class="fas fa-plus-circle"></i> Post New Job</a>
        <a href="#" onclick="showSection('jobs')"><i class="fas fa-list-ul"></i> My Jobs</a>
        <a href="/employer_settings"><i class="fas fa-cog"></i> Settings</a>
        <div style="flex-grow:1;"></div>
        <button class="logout-btn" onclick="confirmLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Welcome, {{ user_name }}</h1>
        </div>

        <div id="section-post" class="card">
            <h2><i class="fas fa-edit"></i> Post a New Job</h2>
            <input type="text" id="job-title" placeholder="Job Title">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <input type="text" id="job-loc" placeholder="Location">
                <input type="text" id="job-sal" placeholder="Salary">
            </div>
            <select id="job-exp">
                <option value="">Select Experience Level</option>
                <option value="Fresher">Fresher</option>
                <option value="1-3 Years">1-3 Years</option>
                <option value="3-5 Years">3-5 Years</option>
                <option value="5+ Years">5+ Years</option>
            </select>
            <input type="text" id="job-skills" placeholder="Skills (comma separated)">
            <select id="job-cat">
                <option value="">Select Category</option>
            </select>
            <textarea id="job-desc" placeholder="Job Description" rows="4"></textarea>
            <button class="btn" onclick="postJob()">Post Job</button>
        </div>

        <div id="section-jobs" class="card" style="display:none;">
            <h2><i class="fas fa-briefcase"></i> Your Posted Jobs</h2>
            <div id="jobs-list" class="job-container"></div>
        </div>
    </div>

    <!-- Applicants Modal -->
    <div id="applicantsModal" class="modal-overlay">
        <div class="modal-box">
            <span onclick="closeApplicantsModal()" style="cursor:pointer;float:right; font-size:25px;">&times;</span>
            <h2>Applicants</h2>
            <div id="applicants-list" style="margin-top:20px;"></div>
        </div>
    </div>

    <!-- Edit Job Modal -->
    <div id="editJobModal" class="modal-overlay">
        <div class="modal-box">
            <span onclick="closeEditModal()" style="cursor:pointer;float:right; font-size:25px;">&times;</span>
            <h2>Edit Job</h2>
            <input type="text" id="edit-title" placeholder="Job Title">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <input type="text" id="edit-loc" placeholder="Location">
                <input type="text" id="edit-sal" placeholder="Salary">
            </div>
            <select id="edit-exp">
                <option value="">Select Experience Level</option>
                <option value="Fresher">Fresher</option>
                <option value="1-3 Years">1-3 Years</option>
                <option value="3-5 Years">3-5 Years</option>
                <option value="5+ Years">5+ Years</option>
            </select>
            <select id="edit-cat"><option value="">Select Category</option></select>
            <input type="text" id="edit-skills" placeholder="Skills (comma separated)">
            <textarea id="edit-desc" placeholder="Job Description" rows="4"></textarea>
            <button class="btn" onclick="saveEditJob()">Save Changes</button>
        </div>
    </div>

    <!-- Logout Modal -->
    <div id="logoutModal" class="modal-overlay">
        <div class="modal-box" style="text-align:center;">
            <h3>Are you sure you want to logout?</h3>
            <button class="modal-btn btn-no" onclick="document.getElementById('logoutModal').style.display='none'">NO</button>
            <button class="modal-btn btn-yes" onclick="window.location.href='/logout'">YES</button>
        </div>
    </div>

    <script>
        function showNotification(message, type = 'success') {
            const c = document.getElementById('notification-container');
            const d = document.createElement('div');
            d.className = `notification notif-${type}`;
            d.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
            c.appendChild(d);
            setTimeout(() => d.remove(), 3000);
        }

        function showSection(id) {
            document.querySelectorAll('.card').forEach(el => el.style.display = 'none');
            document.getElementById('section-' + id).style.display = 'block';
            if (id === 'jobs') loadMyJobs();
        }

        async function postReq(url, data) {
            const res = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            return await res.json();
        }

        async function postJob() {
            const res = await postReq('/api/post_job', {
                title: document.getElementById('job-title').value,
                location: document.getElementById('job-loc').value,
                salary: document.getElementById('job-sal').value,
                experience: document.getElementById('job-exp').value,
                skills: document.getElementById('job-skills').value,
                category: document.getElementById('job-cat').value,
                description: document.getElementById('job-desc').value
            });
            if (res.success) {
                showNotification(res.message || 'Job Posted', 'success');
                showSection('jobs');
            } else {
                showNotification(res.message || 'Error', 'error');
            }
        }

        async function loadMyJobs() {
            const res = await fetch('/api/get_employer_jobs');
            const data = await res.json();
            const list = document.getElementById('jobs-list');
            list.innerHTML = '';
            if (data.success && data.jobs && data.jobs.length > 0) {
                const grads = ['grad-1', 'grad-2', 'grad-3'];
                data.jobs.forEach((j, i) => {
                    list.innerHTML += `<div class="job-card ${grads[i % 3]}"><h4>${j.title}</h4><p><i class="fas fa-map-marker-alt"></i> ${j.location || 'N/A'}</p><p><i class="fas fa-money-bill"></i> ${j.salary || 'N/A'}</p><div class="actions"><button class="btn-sm" onclick="viewApplicants(${j.id})">Applicants</button><button class="btn-sm" style="background:#28a745" onclick="openEditModal(${j.id})">Edit</button><button class="btn-sm" style="background:#dc3545" onclick="deleteJob(${j.id})">Delete</button></div></div>`;
                });
            } else {
                list.innerHTML = '<p style="color:#666">No jobs posted yet.</p>';
            }
        }

        async function deleteJob(id) {
            if (confirm('Delete this job?')) {
                const res = await postReq('/api/delete_job/' + id, {});
                if (res.success) showNotification('Job Deleted', 'success');
                loadMyJobs();
            }
        }

        function closeApplicantsModal() {
            document.getElementById('applicantsModal').style.display = 'none';
        }

        // --- NEW: Copy to Clipboard ---
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('Phone number copied!', 'success');
            }, (err) => {
                console.error('Could not copy text: ', err);
            });
        }

        async function viewApplicants(id) {
            document.getElementById('applicantsModal').style.display = 'flex';
            const res = await fetch('/api/get_applicants/' + id);
            const data = await res.json();
            const list = document.getElementById('applicants-list');
            list.innerHTML = '';

            if (data.success && data.applicants.length > 0) {
                data.applicants.forEach(a => {
                            let statusClass = a.status === 'Selected' ? 'status-selected' : 'status-applied';

                            list.innerHTML += `
                    <div class="applicant-card">
                        <div class="applicant-header">
                            <h3>${a.user_name}</h3>
                            <span class="status-badge ${statusClass}">${a.status}</span>
                        </div>
                        
                        <div class="quick-info">
                            <p>
                                <i class="fas fa-envelope"></i> 
                                <a href="mailto:${a.user_email}" class="contact-link">${a.user_email}</a>
                            </p>
                            <p>
                                <i class="fas fa-phone"></i> 
                                <span onclick="copyToClipboard('${a.user_mobile}')" class="contact-link">${a.user_mobile} <i class="fas fa-copy copy-hint"></i></span>
                            </p>
                        </div>

                        <div class="action-bar">
                            ${a.resume_path ? `<a href="/download_resume/${a.resume_path}" target="_blank" style="text-decoration:none; color:#0f9b8e; font-size:13px;"><i class="fas fa-file-pdf"></i> View Resume</a>` : '<span style="color:#999; font-size:12px;">No Resume</span>'}
                            <button class="view-details-btn" onclick="toggleFullDetails(this)">View Full Details <i class="fas fa-chevron-down"></i></button>
                        </div>

                        <!-- FULL DETAILS -->
                        <div class="full-details-section">
                            <div style="margin-bottom:15px;">
                                <h4 style="color:#0f9b8e; margin-bottom:8px; font-size:14px;">EDUCATION</h4>
                                <div class="detail-grid">
                                    <div class="detail-group"><label>Qualification</label><span>${a.qualification || 'N/A'}</span></div>
                                    <div class="detail-group"><label>College</label><span>${a.college_name || 'N/A'}</span></div>
                                    <div class="detail-group"><label>Passing Year</label><span>${a.year_of_passing || 'N/A'}</span></div>
                                </div>
                            </div>

                            <div style="margin-bottom:15px;">
                                <h4 style="color:#0f9b8e; margin-bottom:8px; font-size:14px;">EXPERIENCE</h4>
                                <div class="detail-grid">
                                    <div class="detail-group"><label>Level</label><span>${a.experience_level}</span></div>
                                    ${a.experience_level === 'Experienced' ? `
                                    <div class="detail-group"><label>Years</label><span>${a.years_experience || 'N/A'}</span></div>
                                    <div class="detail-group"><label>Previous Company</label><span>${a.previous_company || 'N/A'}</span></div>
                                    ` : ''}
                                </div>
                            </div>

                            <div style="margin-bottom:15px;">
                                <h4 style="color:#0f9b8e; margin-bottom:8px; font-size:14px;">ADDITIONAL</h4>
                                <div class="detail-group"><label>Skills</label><span>${a.skills || 'N/A'}</span></div>
                                <div class="detail-grid">
                                    <div class="detail-group"><label>Current Location</label><span>${a.current_location || 'N/A'}</span></div>
                                    <div class="detail-group"><label>Expected Salary</label><span>${a.expected_salary || 'N/A'}</span></div>
                                </div>
                            </div>

                            <div style="margin-bottom:15px;">
                                <h4 style="color:#0f9b8e; margin-bottom:8px; font-size:14px;">COVER LETTER</h4>
                                <p style="background:white; padding:10px; border-radius:4px; font-size:13px; border:1px solid #eee;">${a.cover_letter || 'Not Provided'}</p>
                            </div>
                            
                            <div style="text-align:right; margin-top:10px; display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap;">
                                <button onclick="updateStatus(${a.id}, 'Shortlisted', this)" style="padding:6px 14px; background:#6c757d; color:white; border:none; border-radius:4px; cursor:pointer;">Shortlist</button>
                                <button onclick="updateStatus(${a.id}, 'Interview', this)" style="padding:6px 14px; background:#0f9b8e; color:white; border:none; border-radius:4px; cursor:pointer;">Interview</button>
                                <button onclick="updateStatus(${a.id}, 'Selected', this)" style="padding:6px 14px; background:#28a745; color:white; border:none; border-radius:4px; cursor:pointer;">Select</button>
                                <button onclick="updateStatus(${a.id}, 'Rejected', this)" style="padding:6px 14px; background:#dc3545; color:white; border:none; border-radius:4px; cursor:pointer;">Reject</button>
                            </div>
                        </div>
                    </div>`;
                });
            } else { list.innerHTML = '<p>No applicants yet.</p>'; }
        }
        
        function toggleFullDetails(btn) {
            const details = btn.closest('.applicant-card').querySelector('.full-details-section');
            const icon = btn.querySelector('i');
            if (details.classList.contains('active')) {
                details.classList.remove('active');
                btn.innerHTML = 'View Full Details <i class="fas fa-chevron-down"></i>';
            } else {
                details.classList.add('active');
                btn.innerHTML = 'Hide Details <i class="fas fa-chevron-up"></i>';
            }
        }
        
        const STATUS_BADGE = {
            'Applied': 'status-applied',
            'Shortlisted': 'status-applied',
            'Interview': 'status-applied',
            'Selected': 'status-selected',
            'Rejected': ''
        };
        async function updateStatus(appId, status, btn) {
            if (status === 'Rejected' && !confirm('Reject this candidate?')) return;
            const res = await postReq('/api/update_candidate_status', { app_id: appId, status: status });
            if (res.success) {
                showNotification('Candidate marked as ' + status + (status === 'Selected' ? ' & Notified!' : ''), 'success');
                const card = btn.closest('.applicant-card');
                const badge = card.querySelector('.status-badge');
                badge.className = 'status-badge ' + (STATUS_BADGE[status] || '');
                badge.innerText = status;
            } else {
                showNotification(res.message || 'Error', 'error');
            }
        }

        let currentEditId = null;
        async function loadCategories() {
            try {
                const res = await fetch('/api/get_categories');
                const data = await res.json();
                if (!data.success) return;
                const postSel = document.getElementById('job-cat');
                const editSel = document.getElementById('edit-cat');
                [postSel, editSel].forEach(sel => {
                    data.categories.forEach(c => {
                        const o = document.createElement('option');
                        o.value = c.name; o.textContent = c.name;
                        sel.appendChild(o);
                    });
                });
            } catch(e) {}
        }

        async function openEditModal(id) {
            currentEditId = id;
            const res = await fetch('/api/get_employer_jobs');
            const data = await res.json();
            const j = (data.jobs || []).find(x => x.id === id);
            if (!j) return;
            document.getElementById('edit-title').value = j.title || '';
            document.getElementById('edit-loc').value = j.location || '';
            document.getElementById('edit-sal').value = j.salary || '';
            document.getElementById('edit-exp').value = j.experience || '';
            document.getElementById('edit-skills').value = j.skills || '';
            document.getElementById('edit-desc').value = j.description || '';
            document.getElementById('edit-cat').value = j.category || '';
            document.getElementById('editJobModal').style.display = 'flex';
        }
        function closeEditModal() { document.getElementById('editJobModal').style.display = 'none'; }

        async function saveEditJob() {
            const res = await postReq('/api/edit_job/' + currentEditId, {
                title: document.getElementById('edit-title').value,
                location: document.getElementById('edit-loc').value,
                salary: document.getElementById('edit-sal').value,
                experience: document.getElementById('edit-exp').value,
                skills: document.getElementById('edit-skills').value,
                category: document.getElementById('edit-cat').value,
                description: document.getElementById('edit-desc').value
            });
            if (res.success) { showNotification('Job Updated', 'success'); closeEditModal(); loadMyJobs(); }
            else showNotification(res.message || 'Error', 'error');
        }

        function confirmLogout() { document.getElementById('logoutModal').style.display = 'flex'; }
        loadCategories();
    </script>
</body>

</html>
